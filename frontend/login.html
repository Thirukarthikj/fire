<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Firecrackers Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="background-color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
  <div id="notification-container"></div>

  <div class="card" style="max-width: 440px; width: 100%; padding: 40px 36px; background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04); border-radius: var(--radius-xl);">
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 14px; display: inline-flex;">
        <span class="brand-logo-icon">🎆</span>
        <div class="brand-logo-text" style="text-align: left;">
          <span class="brand-name" style="font-size: 1.7rem;">Fire<span class="brand-name-accent">crackers</span></span>
          <span class="brand-sub">SIVAKASI DIRECT WHOLESALE</span>
        </div>
      </a>
      <h2 style="font-size: 1.5rem; margin-bottom: 6px; color: #0f172a;">Welcome Back</h2>
      <p class="text-sm text-light" style="margin-bottom: 0;">Sign in to track orders, manage addresses, and checkout faster.</p>
    </div>

    <div id="checkout-notice" style="display: none; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 12px 14px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 0.875rem; text-align: left; line-height: 1.45;">
      <span style="font-size: 1.1rem; margin-right: 6px;">🛒</span>
      <strong>Ready to Place Your Order?</strong> Please sign in or create an account to enter your delivery address and finalize booking.
    </div>

    <div id="auth-error" class="alert alert-error" style="display: none; font-size: 0.875rem; padding: 12px 16px; margin-bottom: 20px; background-color: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: var(--radius-md);"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <div class="flex-between" style="margin-bottom: 6px;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 24px;">
        Sign In →
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: #64748b;">
      Don't have an account? <a href="/register.html" id="register-link" class="text-accent font-semibold">Create account</a>
    </div>

    <div style="text-align: center; margin-top: 20px; border-top: 1px solid #f1f5f9; padding-top: 18px;">
      <a href="/" class="text-xs text-light">← Return to Storefront</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.initLogin();
    });
  </script>
</body>
</html>
