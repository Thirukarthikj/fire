<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Sign In — Firecrackers Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="background: radial-gradient(circle at 50% 25%, rgba(234, 88, 12, 0.12) 0%, #070707 65%); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
  <div id="notification-container"></div>

  <div class="card" style="max-width: 420px; width: 100%; padding: 44px 36px; background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); border-radius: var(--radius-xl);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="font-size: 2.2rem; margin-bottom: 8px;">🔐</div>
      <h2 style="font-size: 1.6rem; margin-bottom: 6px; color: #ffffff;">Admin Control Panel</h2>
      <p class="text-xs text-light" style="margin-bottom: 0;">Restricted to authorized store managers & Sivakasi dispatch staff.</p>
    </div>

    <div id="admin-auth-error" class="alert alert-error" style="display: none; font-size: 0.875rem; padding: 12px 16px; margin-bottom: 20px; background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; border-radius: var(--radius-md);"></div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="admin-email">Admin Email</label>
        <input type="email" id="admin-email" class="form-control" placeholder="admin@firecrackers.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="admin-password">Secret Password</label>
        <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 24px;">
        Authorize & Enter →
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 18px;">
      <a href="/" class="text-xs text-light">← Return to Storefront</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorBox = document.getElementById('admin-auth-error');

      errorBox.style.display = 'none';

      try {
        const res = await API.post('/admin/login', { email, password });
        if (res.success && res.data) {
          localStorage.setItem('fire_admin_user', JSON.stringify(res.data));
          App.showNotification('Administrator authenticated', 'success');
          window.location.href = '/admin/dashboard.html';
        }
      } catch (err) {
        errorBox.textContent = err.message || 'Authorization failed. Check your admin credentials.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
